[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skydict"
version = "0.1.0"
description = "Dictation App. Free, Simple, Open-source"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "sounddevice>=0.4.6",
    "onnx-asr[cpu,hub]>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]
macos = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-AVFoundation>=10.0",
]

[project.scripts]
skydict = "skydict.cli:app"

[tool.setuptools.packages.find]
include = ["skydict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that download models or hit the network (deselect with '-m \"not slow\"')",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's API is built on calls in argument defaults, and it resolves Optional[X]
# more reliably than X | None on Python 3.10.
"skydict/cli.py" = ["B008", "UP007", "UP045"]
